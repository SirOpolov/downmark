name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita gtksourceview5 webkitgtk-6.0
      - uses: actions/checkout@v5
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
