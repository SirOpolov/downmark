[package]
name = "downmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Lightweight Markdown editor with live preview"
license = "MIT"
repository = "https://github.com/GreisMicha/downmark"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
serde_json = "1.0.154"
sourceview5 = "0.11.3"
webkit6 = "0.6.1"
